name: Build & Release DofusRetroManager

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DofusRetroManager/DofusRetroManager.csproj

      - name: Build (Debug — quick check)
        run: dotnet build DofusRetroManager/DofusRetroManager.csproj --configuration Debug --no-restore

      - name: Publish (Release — single-file exe)
        run: >
          dotnet publish DofusRetroManager/DofusRetroManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DofusRetroManager-win-x64
          path: ./publish/DofusRetroManager.exe
          if-no-files-found: error

      # Create a GitHub Release with the exe when a version tag is pushed
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/DofusRetroManager.exe
          generate_release_notes: true
